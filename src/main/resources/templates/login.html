<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="../static/css/login.css">
</head>
<body>
<div class="login-container">
    <div class="login-image-logo-container">
        <img src="./images/logo-puc-minas.png" alt="Logo PUC Minas">
    </div>
    <div class="login-form">
        <form action="/login" method="get" class="login-form">
            <h4 class="login-title">Login</h4>
            <input type="text" id="username" name="username" placeholder="Username" required>
            <input type="password" id="password" name="password" placeholder="Senha" required>
            <div class="login-button-container">
                <button type="submit">Entrar</button>
            </div>
            <p class="login-redirect-options">
                Ainda não tem cadastro? <br>
                <a href="/src/main/resources/templates/cadastro.html">Cadastre-se</a> |
                <a href="/recoverpassword">Esqueceu sua senha?</a>
            </p>
        </form>
    </div>
</div>
</body>
</html>
